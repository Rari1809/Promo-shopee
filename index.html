<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lagi nyiapin promo terbaik buat kamu...</title>

  <meta property="og:title" content="Racun Shopee Termurah! 🎁">
  <meta property="og:description" content="Cek harga promo selengkapnya di sini sebelum kehabisan.">
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fe/Shopee.svg/800px-Shopee.svg.png">


  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #EE4D2D;
      --orange-glow: rgba(238, 77, 45, 0.4);
      --orange-soft: #fff0ed;
      --text: #1a1a1a;
      --muted: #666;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #fafafa;
      background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    /* Background blur blob */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 400px; height: 400px;
      background: var(--orange);
      top: -100px; right: -100px;
      animation: drift 8s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 350px; height: 350px;
      background: #ffb74d;
      bottom: -100px; left: -100px;
      animation: drift 10s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, -30px) scale(1.1); }
    }

    /* Glassmorphism Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 1);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(238, 77, 45, 0.08), 
                  inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      text-align: center;
      animation: slideUp 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Shopee icon area with floating effect */
    .icon-wrap {
      width: 76px; height: 76px;
      background: var(--orange-soft);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 8px 20px var(--orange-glow);
      animation: pop 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both, 
                 floatIcon 3s ease-in-out infinite 0.7s;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.5) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .icon-wrap svg {
      width: 44px; height: 44px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.4;
      color: #111;
      animation: fadeIn 0.4s 0.3s both;
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 2rem;
      animation: fadeIn 0.4s 0.4s both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Shimmering Progress bar */
    .progress-wrap {
      background: #f0f0f0;
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
      animation: fadeIn 0.4s 0.5s both;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #EE4D2D, #ff7355);
      border-radius: 99px;
      position: relative;
      animation: fill 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .progress-bar::after {
      content: "";
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: shimmer 1.5s infinite;
    }
    @keyframes fill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes shimmer {
      100% { left: 200%; }
    }

    /* Status Text */
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      animation: fadeIn 0.4s 0.6s both;
      margin-bottom: 0;
    }
    .status span {
      color: var(--orange);
      font-weight: 700;
    }

    /* Manual link fallback */
    .fallback {
      margin-top: 1.8rem;
      font-size: 0.85rem;
      color: #888;
      animation: fadeIn 0.4s 0.8s both;
    }
    
    .fallback a {
      color: var(--orange);
      font-weight: 800;
      text-decoration: none;
      display: inline-block;
      background: var(--orange-soft);
      padding: 6px 14px;
      border-radius: 99px;
      margin-top: 0.5rem;
      box-shadow: 0 4px 10px rgba(238, 77, 45, 0.15);
      animation: floatLink 2.5s ease-in-out infinite;
      transition: all 0.2s ease;
    }
    
    @keyframes floatLink {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.03); }
    }

    .fallback a:hover { 
      background: #ffdcd5;
      box-shadow: 0 6px 15px rgba(238, 77, 45, 0.25);
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 5C36.2 5 25 16.2 25 30c0 2.8.4 5.4 1.2 7.9H73.8C74.6 35.4 75 32.8 75 30 75 16.2 63.8 5 50 5z" fill="#EE4D2D"/>
        <path d="M17 42l5.5 47h55L83 42H17z" fill="#EE4D2D"/>
        <circle cx="38" cy="30" r="4" fill="white"/>
        <circle cx="62" cy="30" r="4" fill="white"/>
        <path d="M36 65c0-7.7 6.3-14 14-14s14 6.3 14 14" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <h1>Membuka halaman promo... 🛍️</h1>
    <p>Tunggu sebentar ya, mencari harga terbaik untuk kamu.</p>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>

    <p class="status">Sedang Mengarahkan ke <span>Shopee</span></p>

    <div class="fallback">
      Ga kebuka otomatis?<br>
      <a href="https://s.shopee.co.id/5VSIFnovCd" id="manual-link">👉 Klik di sini yuk ✨</a>
    </div>
  </div>

  <script>
    // ✏️ GANTI URL ini dengan link Shopee affiliate lo
    const AFFILIATE_URL = "https://s.shopee.co.id/5VSIFnovCd";

    document.getElementById("manual-link").href = AFFILIATE_URL;

    // JavaScript ini yang ngerjain auto-redirect tanpa kebaca Facebook
    setTimeout(() => {
      window.location.href = AFFILIATE_URL;
    }, 2000);
  </script>

</body>
</html>
